[project]
name = "pattern-nursery"
version = "0.1.0"
description = "Hybrid clinical NLP library using embeddings to augment keyword/regex methods"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "gensim>=4.0.0",
    "loguru>=0.7.0",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "pytest-cov>=7.0.0",
    "regex>=2023.0.0",
    "scikit-learn>=1.0.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.5.0",
    "tqdm>=4.65.0",
    "typer>=0.9.0",
]

[project.scripts]
pattern-nursery = "pattern_nursery.cli.main:app"
